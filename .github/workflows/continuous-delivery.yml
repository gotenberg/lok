name: Continuous Delivery

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Release binaries
    runs-on: ubuntu-latest
    # Gotenberg's base image: the binaries need no newer glibc than it has.
    container: debian:trixie-slim
    steps:
      # Git first, so the checkout is a repository goreleaser can read. The
      # LibreOfficeKit headers come from trixie-backports, like Gotenberg's
      # LibreOffice.
      - name: Install build dependencies
        run: |
          echo "deb http://deb.debian.org/debian trixie-backports main" >> /etc/apt/sources.list
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            gcc libc6-dev \
            gcc-i686-linux-gnu libc6-dev-i386-cross \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
            gcc-powerpc64le-linux-gnu libc6-dev-ppc64el-cross
          apt-get install -y --no-install-recommends -t trixie-backports libreofficekit-dev

      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build and upload binaries
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
