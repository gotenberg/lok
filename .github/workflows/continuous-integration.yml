name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ (github.event_name == 'pull_request' && github.event.pull_request.number) || 'main' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build test image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and cache Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: lok-testing
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint:
    name: Lint Golang codebase
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Load test image from cache
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: lok-testing
          cache-from: type=gha

      - name: Run linters
        run: make lint

  lint-prettier:
    name: Lint non-Golang codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Run linters
        run: make lint-prettier

  test-unit:
    name: Run unit tests
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Load test image from cache
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: lok-testing
          cache-from: type=gha

      - name: Run unit tests
        run: make test-unit

  test-integration:
    name: Run integration tests
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Load test image from cache
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: lok-testing
          cache-from: type=gha

      - name: Run integration tests
        run: make test-integration

  snapshot:
    if: github.event_name == 'pull_request'
    needs:
      - test-unit
      - test-integration
    name: Snapshot release
    runs-on: ubuntu-latest
    # Same container and dependencies as the release workflow.
    container: debian:trixie-slim
    steps:
      - name: Install build dependencies
        run: |
          echo "deb http://deb.debian.org/debian trixie-backports main" >> /etc/apt/sources.list
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            gcc libc6-dev \
            gcc-i686-linux-gnu libc6-dev-i386-cross \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
            gcc-powerpc64le-linux-gnu libc6-dev-ppc64el-cross
          apt-get install -y --no-install-recommends -t trixie-backports libreofficekit-dev

      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The container user does not own the workspace, so git refuses it
      # unless it is marked safe.
      - name: Mark the workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binaries
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.19.0
          args: release --snapshot --clean
